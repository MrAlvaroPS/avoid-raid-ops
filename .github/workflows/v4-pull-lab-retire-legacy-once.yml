name: V4 Pull Lab legacy retirement once

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/reorganizacion-2026-08-17
          fetch-depth: 1
      - name: Retire only the approved legacy Pull Lab writer
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('public/wcl-runtime.js')
          text=p.read_text()
          start_token='function applyPullLab() {'
          next_token='function applyDamageHealing() {'
          if text.count(start_token)!=1:
              raise SystemExit(f'expected exactly one applyPullLab declaration, found {text.count(start_token)}')
          start=text.index(start_token)
          end=text.index(next_token,start)
          text=text[:start]+text[end:]
          old='applyShell();applyCommandCenter();applyPullLab();applyDamageHealing();'
          new='applyShell();applyCommandCenter();window.applyPullLabSource?.();applyDamageHealing();'
          if text.count(old)!=1:
              raise SystemExit(f'expected exactly one applyAll call sequence, found {text.count(old)}')
          text=text.replace(old,new,1)
          if 'function applyPullLab() {' in text:
              raise SystemExit('applyPullLab declaration survived')
          if text.count('window.applyPullLabSource?.()')!=1:
              raise SystemExit('expected exactly one source-owner delegation')
          p.write_text(text)
          PY
          git diff --check
          git diff -- public/wcl-runtime.js
      - name: Commit exact retirement
        run: |
          git config user.name "AvoiD v4 migration"
          git config user.email "actions@users.noreply.github.com"
          git add public/wcl-runtime.js
          test "$(git diff --cached --name-only)" = "public/wcl-runtime.js"
          git commit -m "refactor(v4): retire Pull Lab legacy writer"
          git push origin HEAD:refactor/reorganizacion-2026-08-17
