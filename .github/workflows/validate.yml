name: Apply split bridge retirement

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v4-split-bridge-retirement
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/reorganizacion-2026-08-17
          fetch-depth: 0
      - name: Apply strict retirement one-shot
        id: migration
        run: |
          if [ ! -f scripts/migrations/v4-retire-split-bridge.mjs ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/migrations/v4-retire-split-bridge.mjs
          test ! -e scripts/migrations/v4-retire-split-bridge.mjs
          git diff --exit-code -- public/wcl-runtime.js && {
            echo "Expected wcl-runtime cleanup was not produced" >&2
            exit 1
          }
          git diff --exit-code -- scripts/verify-legacy-runtime-ownership.mjs && {
            echo "Expected ownership verifier cleanup was not produced" >&2
            exit 1
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit approved bridge retirement
        if: steps.migration.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wcl-runtime.js scripts/verify-legacy-runtime-ownership.mjs scripts/migrations/v4-retire-split-bridge.mjs
          git commit -m "refactor(v4): remove retired split bridge call site"
          git push origin HEAD:refactor/reorganizacion-2026-08-17
