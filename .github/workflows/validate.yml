name: Validate AvoiD Raid Ops

on:
  push:
    branches:
      - "**"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax and Vercel contract
        run: npm run verify:vercel
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee /tmp/avoid-unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              message=${line#not ok * - }
              echo "::error title=Unit test failure::${message}"
            done < <(grep '^not ok ' /tmp/avoid-unit-tests.log || true)
            exit "$status"
          fi