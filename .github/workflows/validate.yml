name: Apply Command Center owner promotion

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v4-command-center-owner-promotion
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/reorganizacion-2026-08-17
          fetch-depth: 0
      - name: Apply strict owner-promotion one-shot
        id: migration
        run: |
          if [ ! -f scripts/migrations/v4-promote-command-center-owner.mjs ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/migrations/v4-promote-command-center-owner.mjs
          test ! -e scripts/migrations/v4-promote-command-center-owner.mjs
          git diff --exit-code -- scripts/verify-legacy-runtime-ownership.mjs && {
            echo "Expected ownership verifier promotion was not produced" >&2
            exit 1
          }
          git diff --exit-code -- tests/unit/v3711-release.test.mjs && {
            echo "Expected historical release contract promotion was not produced" >&2
            exit 1
          }
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit Command Center owner contracts
        if: steps.migration.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-legacy-runtime-ownership.mjs tests/unit/v3711-release.test.mjs scripts/migrations/v4-promote-command-center-owner.mjs
          git commit -m "test(v4): promote Command Center ownership contracts"
          git push origin HEAD:refactor/reorganizacion-2026-08-17
