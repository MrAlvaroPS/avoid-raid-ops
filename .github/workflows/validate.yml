name: Validate AvoiD Raid Ops

on:
  push:
    branches:
      - "**"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Install Data Truth browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - name: Full repository verification
        run: npm run verify
      - name: Production build contract
        run: npm run build
