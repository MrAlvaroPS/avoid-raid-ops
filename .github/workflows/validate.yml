name: Apply approved v4 ownership checkpoint

on:
  push:
    branches:
      - refactor/reorganizacion-2026-08-17
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v4-ownership-checkpoint
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout refactor branch
        uses: actions/checkout@v4
        with:
          ref: refactor/reorganizacion-2026-08-17
          fetch-depth: 0
      - name: Apply strict one-shot when present
        id: migration
        run: |
          if [ ! -f scripts/migrations/v4-align-defensive-retirement-count.mjs ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/migrations/v4-align-defensive-retirement-count.mjs
          git diff --exit-code -- scripts/verify-legacy-runtime-ownership.mjs && {
            echo "Expected verifier change was not produced" >&2
            exit 1
          }
          test ! -e scripts/migrations/v4-align-defensive-retirement-count.mjs
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit approved checkpoint
        if: steps.migration.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-legacy-runtime-ownership.mjs scripts/migrations/v4-align-defensive-retirement-count.mjs
          git commit -m "test(v4): align ownership count after Defensive retirement"
          git push origin HEAD:refactor/reorganizacion-2026-08-17
