name: Validate AvoiD Raid Ops

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Apply approved Pull Lab migration once
        if: github.event_name == 'pull_request'
        run: |
          if grep -q 'function applyPullLab() {' public/wcl-runtime.js; then
            python3 scripts/migrate-pull-lab-owner-once.py
            python3 scripts/patch-pull-lab-verifier-once.py
            git diff --check
            node --test tests/unit/pull-lab-runtime-v4.test.mjs tests/unit/active-assets-manifest-v4.test.mjs tests/unit/runtime-dom-safety-v389.test.mjs tests/unit/legacy-runtime-ownership-v4.test.mjs
            node scripts/verify-legacy-runtime-ownership.mjs
            node scripts/sync-active-asset-html.mjs --check
            git config user.name "AvoiD v4 migration"
            git config user.email "actions@users.noreply.github.com"
            git add apps/web/src/features/pull-lab/runtime.js public/pull-lab-runtime.js public/wcl-runtime.js config/legacy-runtime-ownership.mjs config/active-assets.mjs index.html scripts/verify-legacy-runtime-ownership.mjs tests/unit/pull-lab-runtime-v4.test.mjs tests/unit/active-assets-manifest-v4.test.mjs tests/unit/runtime-dom-safety-v389.test.mjs tests/unit/legacy-runtime-ownership-v4.test.mjs
            test "$(git diff --cached --name-only | wc -l)" -eq 11
            git commit -m "refactor(v4): promote Pull Lab source owner"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Pull Lab legacy writer already retired; migration step is a no-op."
          fi
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Install Data Truth browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install chromium
      - name: Golden integrity
        run: npm run verify:golden
      - name: Architecture and quarantine
        run: npm run verify:architecture
      - name: Active assets and CSS transport
        run: npm run verify:assets
      - name: Legacy runtime ownership
        run: npm run verify:legacy-runtime
      - name: Source reconstruction
        run: npm run verify:reconstruction
      - name: Browser Data Truth
        run: |
          grep -n -C 10 -E "Pull Lab source parity|shadowAgainstLegacy|AVOID_PULL_LAB_SOURCE_RUNTIME" scripts/verify_data_truth_ui.py || true
          npm run verify:data-truth
      - name: Release ownership
        run: npm run verify:release
      - name: Critical contracts
        run: npm run test:critical
      - name: Unit and regression suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.txt
      - name: Upload unit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.sha }}
          path: unit-test-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Production build contract
        run: npm run build
      - name: Publish AvoiD validation status
        if: always()
        env:
          GH_STATUS_TOKEN: ${{ github.token }}
          VALIDATION_JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$VALIDATION_JOB_STATUS" = "success" ]; then
            STATE=success
            DESCRIPTION="All AvoiD validation gates and production build passed"
          else
            STATE=failure
            DESCRIPTION="One or more AvoiD validation gates failed"
          fi
          PAYLOAD=$(printf '{"state":"%s","context":"AvoiD Validation","description":"%s","target_url":"https://github.com/%s/actions/runs/%s"}' "$STATE" "$DESCRIPTION" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_STATUS_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$PAYLOAD" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
