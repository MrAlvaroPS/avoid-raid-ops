name: Validate AvoiD Raid Ops

on:
  push:
    branches:
      - "**"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Syntax and Vercel contract
        run: npm run verify:vercel
      - name: Unit tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            excerpt=$(grep -E 'not ok|failureType:|error:|AssertionError|ERR_[A-Z_]+' test-output.log | tail -n 24 | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Unit tests failed::$excerpt"
          fi
          exit "$code"
