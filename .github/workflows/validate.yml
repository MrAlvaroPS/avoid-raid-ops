name: Validate AvoiD Raid Ops

on:
  push:
    branches:
      - "**"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Install Data Truth browser dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.54.0
          python3 -m playwright install --with-deps chromium
      - name: Golden integrity
        run: npm run verify:golden
      - name: Architecture and quarantine
        run: npm run verify:architecture
      - name: Active assets and CSS transport
        run: npm run verify:assets
      - name: Legacy runtime ownership
        run: npm run verify:legacy-runtime
      - name: Source reconstruction
        run: npm run verify:reconstruction
      - name: Browser Data Truth
        run: npm run verify:data-truth
      - name: Release ownership
        run: npm run verify:release
      - name: Critical contracts
        run: npm run test:critical
      - name: Unit and regression suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-test-output.txt
      - name: Upload unit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-failure-${{ github.sha }}
          path: unit-test-output.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Production build contract
        run: npm run build
